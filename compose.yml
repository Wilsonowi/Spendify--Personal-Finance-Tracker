name: spendify

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spendify}
      POSTGRES_USER: ${POSTGRES_USER:-spendify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-local-env.ps1 first}
      TZ: Asia/Kuala_Lumpur
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [data]

  minio:
    image: pgsty/silo:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-spendify-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/init-local-env.ps1 first}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [data]

  ocr:
    build: ./ocr-service
    environment:
      TZ: Asia/Kuala_Lumpur
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [processing]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-spendify}
      POSTGRES_USER: ${POSTGRES_USER:-spendify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-local-env.ps1 first}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-spendify-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/init-local-env.ps1 first}
      SPENDIFY_MASTER_KEY_BASE64: ${SPENDIFY_MASTER_KEY_BASE64:?Run scripts/init-local-env.ps1 first}
      OCR_BASE_URL: http://ocr:8090
      OCR_ENABLED: "true"
      SPENDIFY_AI_ENABLED: ${SPENDIFY_AI_ENABLED:-false}
      SPENDIFY_AI_MODEL: ${SPENDIFY_AI_MODEL:-none}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      COOKIE_SECURE: "false"
      TZ: Asia/Kuala_Lumpur
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      ocr: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks: [data, processing, web]

  frontend:
    build: ./frontend
    ports:
      - "5173:8080"
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [web]

volumes:
  postgres-data:
  minio-data:

networks:
  data:
    internal: true
  processing:
    internal: true
  web:
